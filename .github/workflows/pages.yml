name: Publicar maqueta en GitHub Pages

# Publica solo la carpeta maqueta/ (HTML + JS estáticos, sin build).
# Requisito único: en el repositorio, Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "maqueta/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas de navegador y leyes de diseño
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: maqueta
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maqueta/package-lock.json

      - name: Instalar dependencias de prueba
        run: npm ci --no-audit --no-fund

      - name: Instalar el navegador de pruebas
        run: npx playwright install --with-deps chromium

      - name: Correr las pruebas
        run: npx playwright test

      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: maqueta/playwright-report
          retention-days: 7

  desplegar:
    needs: pruebas
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Leyes de diseño (maqueta/DESIGN.md)
        run: node maqueta/tools/lint-design.mjs

      - name: Revisar que existan los archivos de la maqueta
        run: |
          for f in index.html app.js esquema.js catalogos.js css/theme.css ui/atoms.js ui/molecules.js ui/organisms.js ui/theme.js DESIGN.md sw.js manifest.webmanifest icon.svg vendor/alpine.min.js vendor/leaflet.js vendor/leaflet.css vendor/xlsx.full.min.js; do
            test -f "maqueta/$f" || { echo "Falta maqueta/$f"; exit 1; }
          done

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir la carpeta maqueta como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: maqueta

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
